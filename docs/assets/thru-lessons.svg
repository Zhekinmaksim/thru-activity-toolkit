<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F2EDE4"/>

  <!-- left ink bar -->
  <rect x="0" y="0" width="80" height="900" fill="#1A1209"/>

  <!-- horizontal rules -->
  <line x1="0" y1="120" x2="1600" y2="120" stroke="#C8BFB0" stroke-width="1"/>
  <line x1="0" y1="820" x2="1600" y2="820" stroke="#1A1209" stroke-width="3"/>

  <!-- Header tag -->
  <text x="108" y="82" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="6">THRU ALPHANET — WHAT THIS RUN TAUGHT ME</text>

  <!-- Big pull quote left side -->
  <text x="108" y="200" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" font-style="italic">Lessons.</text>
  <rect x="108" y="212" width="280" height="5" fill="#D4491A"/>
  <text x="108" y="248" fill="#4A3F33" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">The useful part was not the screenshot.</text>
  <text x="108" y="274" fill="#4A3F33" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">It was the friction I had to remove.</text>

  <!-- Lesson 1 — big number + ruled box style -->
  <rect x="108" y="306" width="450" height="470" fill="#1A1209"/>
  <rect x="110" y="308" width="446" height="466" fill="#F2EDE4"/>
  <!-- number -->
  <text x="124" y="386" fill="#D4491A" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700">1.</text>
  <line x1="124" y1="398" x2="544" y2="398" stroke="#1A1209" stroke-width="2"/>
  <!-- title -->
  <text x="124" y="436" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700">CLI drift is real</text>
  <!-- detail -->
  <text x="124" y="476" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Older examples assumed commands</text>
  <text x="124" y="500" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">that were not present on the</text>
  <text x="124" y="524" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">installed CLI.</text>
  <!-- takeaway -->
  <line x1="124" y1="554" x2="544" y2="554" stroke="#C8BFB0" stroke-width="1"/>
  <text x="124" y="586" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">Automation gets honest only when</text>
  <text x="124" y="608" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">it targets the tool on your</text>
  <text x="124" y="630" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">machine today.</text>
  <!-- category tag -->
  <rect x="124" y="716" width="118" height="28" fill="#D4491A"/>
  <text x="134" y="735" fill="#F2EDE4" font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="1">environment</text>

  <!-- Lesson 2 -->
  <rect x="578" y="306" width="450" height="470" fill="#1A1209"/>
  <rect x="580" y="308" width="446" height="466" fill="#F2EDE4"/>
  <text x="594" y="386" fill="#D4491A" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700">2.</text>
  <line x1="594" y1="398" x2="1014" y2="398" stroke="#1A1209" stroke-width="2"/>
  <text x="594" y="436" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700">Alias ≠ address</text>
  <text x="594" y="476" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Some steps accepted a local alias.</text>
  <text x="594" y="500" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Others needed the full</text>
  <text x="594" y="524" fill="#3D3428" font-family="'Courier New', Courier, monospace" font-size="16">ta...</text>
  <text x="640" y="524" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18"> key.</text>
  <line x1="594" y1="554" x2="1014" y2="554" stroke="#C8BFB0" stroke-width="1"/>
  <text x="594" y="586" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">A good toolkit resolves that once</text>
  <text x="594" y="608" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">and keeps every later step simple.</text>
  <rect x="594" y="716" width="96" height="28" fill="#1A1209"/>
  <text x="604" y="735" fill="#F2EDE4" font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="1">addressing</text>

  <!-- Lesson 3 -->
  <rect x="1048" y="306" width="450" height="470" fill="#1A1209"/>
  <rect x="1050" y="308" width="446" height="466" fill="#F2EDE4"/>
  <text x="1064" y="386" fill="#D4491A" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700">3.</text>
  <line x1="1064" y1="398" x2="1484" y2="398" stroke="#1A1209" stroke-width="2"/>
  <text x="1064" y="436" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700">Verify the state</text>
  <text x="1064" y="476" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">One nameservice step finished</text>
  <text x="1064" y="500" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">with the wrong record value.</text>
  <line x1="1064" y1="554" x2="1484" y2="554" stroke="#C8BFB0" stroke-width="1"/>
  <text x="1064" y="586" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">A green terminal line is not the</text>
  <text x="1064" y="608" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">same thing as correct state</text>
  <text x="1064" y="630" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">on-chain.</text>
  <rect x="1064" y="716" width="94" height="28" fill="#D4491A"/>
  <text x="1074" y="735" fill="#F2EDE4" font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="1">validation</text>

  <!-- Bottom bar -->
  <rect x="80" y="820" width="1520" height="80" fill="#1A1209"/>
  <text x="108" y="870" fill="#F2EDE4" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic">Shipping a chain workflow means turning fragile steps into repeatable behavior.</text>
</svg>
