<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F6F2E7"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="110" y="110" fill="#17233A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="56" font-weight="700">What this run taught me</text>
  <text x="110" y="160" fill="#5B6880" font-family="Avenir Next, Segoe UI, sans-serif" font-size="26">The real value was not the screenshot. It was the friction that had to be removed.</text>

  <rect x="110" y="240" width="420" height="470" rx="30" fill="#FFFFFF" stroke="#E1D8C7"/>
  <text x="145" y="305" fill="#BC5C19" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28" font-weight="700">CLI drift is real</text>
  <text x="145" y="360" fill="#3C465A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="25">`keys show` was not available</text>
  <text x="145" y="400" fill="#3C465A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="25">on the installed CLI version.</text>
  <text x="145" y="470" fill="#68758C" font-family="Avenir Next, Segoe UI, sans-serif" font-size="23">If you build from older examples</text>
  <text x="145" y="505" fill="#68758C" font-family="Avenir Next, Segoe UI, sans-serif" font-size="23">without checking the actual command</text>
  <text x="145" y="540" fill="#68758C" font-family="Avenir Next, Segoe UI, sans-serif" font-size="23">surface, your automation lies to you.</text>

  <rect x="590" y="240" width="420" height="470" rx="30" fill="#FFFFFF" stroke="#DDE3EC"/>
  <text x="625" y="305" fill="#1668A8" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28" font-weight="700">Alias ≠ address</text>
  <text x="625" y="360" fill="#3C465A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="25">Some commands accept `default`.</text>
  <text x="625" y="400" fill="#3C465A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="25">Some need a `ta...` pubkey.</text>
  <text x="625" y="470" fill="#68758C" font-family="Avenir Next, Segoe UI, sans-serif" font-size="23">A decent toolkit resolves that once</text>
  <text x="625" y="505" fill="#68758C" font-family="Avenir Next, Segoe UI, sans-serif" font-size="23">instead of making every script guess.</text>

  <rect x="1070" y="240" width="420" height="470" rx="30" fill="#FFFFFF" stroke="#D7E7E0"/>
  <text x="1105" y="305" fill="#0F766E" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28" font-weight="700">Verify everything</text>
  <text x="1105" y="360" fill="#3C465A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="25">The nameservice flow "worked"</text>
  <text x="1105" y="400" fill="#3C465A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="25">before the record value was correct.</text>
  <text x="1105" y="470" fill="#68758C" font-family="Avenir Next, Segoe UI, sans-serif" font-size="23">Success output is not the same thing</text>
  <text x="1105" y="505" fill="#68758C" font-family="Avenir Next, Segoe UI, sans-serif" font-size="23">as correct state on-chain.</text>

  <rect x="110" y="790" width="1380" height="120" rx="28" fill="#17233A"/>
  <text x="150" y="860" fill="#F6F8FC" font-family="Avenir Next, Segoe UI, sans-serif" font-size="34" font-weight="700">
    Shipping a chain workflow means turning fragile steps into repeatable behavior.
  </text>
</svg>
