<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- clip regions for each card — tight to the white inner rect -->
    <clipPath id="clip1"><rect x="110" y="292" width="456" height="488"/></clipPath>
    <clipPath id="clip2"><rect x="590" y="292" width="456" height="488"/></clipPath>
    <clipPath id="clip3"><rect x="1070" y="292" width="456" height="488"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#F2EDE4"/>

  <!-- left ink bar -->
  <rect x="0" y="0" width="80" height="900" fill="#1A1209"/>

  <!-- horizontal rules -->
  <line x1="0" y1="120" x2="1600" y2="120" stroke="#C8BFB0" stroke-width="1"/>
  <line x1="0" y1="820" x2="1600" y2="820" stroke="#1A1209" stroke-width="3"/>

  <!-- Header tag -->
  <text x="108" y="82" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="6">THRU ALPHANET — WHAT THIS RUN TAUGHT ME</text>

  <!-- Pull quote -->
  <text x="108" y="188" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" font-style="italic">Lessons.</text>
  <rect x="108" y="200" width="280" height="5" fill="#D4491A"/>
  <text x="108" y="236" fill="#4A3F33" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">The useful part was not the screenshot.</text>
  <text x="108" y="262" fill="#4A3F33" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">It was the friction I had to remove.</text>

  <!-- ═══ CARD 1: x=108..568 ═══ -->
  <!-- border -->
  <rect x="108" y="290" width="460" height="490" fill="#1A1209"/>
  <!-- white fill -->
  <rect x="110" y="292" width="456" height="486" fill="#F2EDE4"/>
  <!-- clipped content -->
  <g clip-path="url(#clip1)">
    <text x="124" y="366" fill="#D4491A" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700">1.</text>
    <line x1="124" y1="380" x2="552" y2="380" stroke="#1A1209" stroke-width="2"/>
    <text x="124" y="416" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">CLI drift is real</text>
    <text x="124" y="452" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="17">Older examples assumed commands</text>
    <text x="124" y="476" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="17">that were not present on the</text>
    <text x="124" y="500" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="17">installed CLI.</text>
    <line x1="124" y1="524" x2="552" y2="524" stroke="#C8BFB0" stroke-width="1"/>
    <text x="124" y="552" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic">Automation gets honest only when</text>
    <text x="124" y="574" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic">it targets the tool on your</text>
    <text x="124" y="596" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic">machine today.</text>
    <rect x="124" y="700" width="118" height="28" fill="#D4491A"/>
    <text x="134" y="719" fill="#F2EDE4" font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="1">environment</text>
  </g>

  <!-- ═══ CARD 2: x=588..1048 ═══ -->
  <rect x="588" y="290" width="460" height="490" fill="#1A1209"/>
  <rect x="590" y="292" width="456" height="486" fill="#F2EDE4"/>
  <g clip-path="url(#clip2)">
    <text x="604" y="366" fill="#D4491A" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700">2.</text>
    <line x1="604" y1="380" x2="1032" y2="380" stroke="#1A1209" stroke-width="2"/>
    <text x="604" y="416" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">Alias ≠ address</text>
    <text x="604" y="452" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="17">Some steps accepted a local alias.</text>
    <text x="604" y="476" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="17">Others needed the full key.</text>
    <text x="604" y="500" fill="#3D3428" font-family="'Courier New', Courier, monospace" font-size="15">ta2JpVS6... (full pubkey)</text>
    <line x1="604" y1="524" x2="1032" y2="524" stroke="#C8BFB0" stroke-width="1"/>
    <text x="604" y="552" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic">A good toolkit resolves that once</text>
    <text x="604" y="574" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic">and keeps every later step simple.</text>
    <rect x="604" y="700" width="96" height="28" fill="#1A1209"/>
    <text x="614" y="719" fill="#F2EDE4" font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="1">addressing</text>
  </g>

  <!-- ═══ CARD 3: x=1068..1528 ═══ -->
  <rect x="1068" y="290" width="460" height="490" fill="#1A1209"/>
  <rect x="1070" y="292" width="456" height="486" fill="#F2EDE4"/>
  <g clip-path="url(#clip3)">
    <text x="1084" y="356" fill="#D4491A" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700">3.</text>
    <line x1="1084" y1="380" x2="1512" y2="380" stroke="#1A1209" stroke-width="2"/>
    <text x="1084" y="416" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">Verify the state</text>
    <text x="1084" y="452" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="17">One nameservice step finished</text>
    <text x="1084" y="476" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="17">with the wrong record value.</text>
    <line x1="1084" y1="524" x2="1512" y2="524" stroke="#C8BFB0" stroke-width="1"/>
    <text x="1084" y="552" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic">A green terminal line is not the</text>
    <text x="1084" y="574" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic">same thing as correct state</text>
    <text x="1084" y="596" fill="#7A6E62" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic">on-chain.</text>
    <rect x="1084" y="700" width="94" height="28" fill="#D4491A"/>
    <text x="1094" y="719" fill="#F2EDE4" font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="1">validation</text>
  </g>

  <!-- Bottom bar -->
  <rect x="80" y="820" width="1520" height="80" fill="#1A1209"/>
  <text x="108" y="868" fill="#F2EDE4" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic">Shipping a chain workflow means turning fragile steps into repeatable behavior.</text>
</svg>
