<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F2EDE4"/>

  <!-- Grid lines - editorial feel -->
  <line x1="0" y1="120" x2="1600" y2="120" stroke="#C8BFB0" stroke-width="1"/>
  <line x1="0" y1="840" x2="1600" y2="840" stroke="#C8BFB0" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="900" stroke="#C8BFB0" stroke-width="1"/>
  <line x1="880" y1="0" x2="880" y2="900" stroke="#C8BFB0" stroke-width="1"/>

  <!-- Big ink block left -->
  <rect x="0" y="0" width="80" height="900" fill="#1A1209"/>

  <!-- Issue / tag line -->
  <text x="108" y="82" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="6" font-weight="400">THRU ALPHANET — DEVLOG</text>

  <!-- Massive headline -->
  <text x="108" y="250" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="700" font-style="italic">From setup</text>
  <text x="108" y="360" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="700" font-style="italic">to chain.</text>

  <!-- Rule -->
  <rect x="108" y="388" width="600" height="5" fill="#D4491A"/>

  <!-- Subline -->
  <text x="108" y="432" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic">Without faking the hard parts.</text>

  <!-- Body text block -->
  <text x="108" y="490" fill="#4A3F33" font-family="Georgia, 'Times New Roman', serif" font-size="21">I rebuilt the full path from docs to a real Alphanet result,</text>
  <text x="108" y="520" fill="#4A3F33" font-family="Georgia, 'Times New Roman', serif" font-size="21">fixed the paper cuts, and turned it into a rerunnable toolkit.</text>

  <!-- Tag pills — plain text version -->
  <text x="108" y="590" fill="#D4491A" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" letter-spacing="2">PROGRAM LIVE  ·  COUNTER +1  ·  MINT READY</text>

  <!-- URL -->
  <line x1="108" y1="616" x2="740" y2="616" stroke="#1A1209" stroke-width="2"/>
  <text x="108" y="645" fill="#1A1209" font-family="'Courier New', Courier, monospace" font-size="20">github.com/Zhekinmaksim/thru-activity-toolkit</text>

  <!-- Right panel — terminal block, raw -->
  <rect x="900" y="120" width="700" height="720" fill="#1A1209"/>

  <!-- Terminal header row -->
  <rect x="900" y="120" width="700" height="52" fill="#2A2018"/>
  <circle cx="940" cy="146" r="9" fill="#D4491A"/>
  <circle cx="968" cy="146" r="9" fill="#D4A41A"/>
  <circle cx="996" cy="146" r="9" fill="#4CAF50"/>
  <text x="1032" y="152" fill="#7A6E62" font-family="'Courier New', Courier, monospace" font-size="18">terminal / real run</text>

  <!-- Terminal content -->
  <text x="930" y="228" fill="#6EE7B7" font-family="'Courier New', Courier, monospace" font-size="22">$ ./scripts/setup.sh</text>
  <text x="930" y="266" fill="#B8AA9A" font-family="'Courier New', Courier, monospace" font-size="19">account: default</text>
  <text x="930" y="298" fill="#B8AA9A" font-family="'Courier New', Courier, monospace" font-size="19">sdk: installed</text>
  <text x="930" y="330" fill="#B8AA9A" font-family="'Courier New', Courier, monospace" font-size="19">faucet: funded</text>

  <text x="930" y="394" fill="#6EE7B7" font-family="'Courier New', Courier, monospace" font-size="22">$ ./scripts/deploy.sh</text>
  <text x="930" y="432" fill="#B8AA9A" font-family="'Courier New', Courier, monospace" font-size="19">program: tabF3aOH...PBRja8yJ</text>

  <text x="930" y="496" fill="#6EE7B7" font-family="'Courier New', Courier, monospace" font-size="22">$ ./scripts/counter-inc.sh</text>
  <text x="930" y="534" fill="#B8AA9A" font-family="'Courier New', Courier, monospace" font-size="19">counter value: 1</text>

  <text x="930" y="598" fill="#6EE7B7" font-family="'Courier New', Courier, monospace" font-size="22">$ ./scripts/mint-init.sh</text>
  <text x="930" y="636" fill="#B8AA9A" font-family="'Courier New', Courier, monospace" font-size="19">mint: taxzKuw...sp7_Ttznt71</text>
  <text x="930" y="668" fill="#B8AA9A" font-family="'Courier New', Courier, monospace" font-size="19">status: ready</text>

  <!-- bottom bar on terminal -->
  <rect x="900" y="776" width="700" height="64" fill="#D4491A"/>
  <text x="930" y="816" fill="#F2EDE4" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">real deploy, real state, real fixes</text>

  <!-- bottom bar full width -->
  <rect x="0" y="840" width="880" height="60" fill="#1A1209"/>
  <text x="108" y="878" fill="#F2EDE4" font-family="'Courier New', Courier, monospace" font-size="18" letter-spacing="1">ALPHANET · 2026 · OPEN SOURCE</text>
</svg>
