<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F7FB"/>
      <stop offset="1" stop-color="#E8EEF8"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="314" x2="1480" y2="314" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C70A5"/>
      <stop offset="1" stop-color="#18806E"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1445" cy="108" r="156" fill="#D9E7F8"/>
  <circle cx="164" cy="764" r="148" fill="#DCEFEA"/>

  <text x="90" y="102" fill="#16253A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="52" font-weight="700">What the toolkit actually runs</text>
  <text x="90" y="145" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24">
    A repeatable Thru Alphanet flow with checks, retries, logs, and state snapshots.
  </text>

  <line x1="160" y1="286" x2="1440" y2="286" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>

  <g>
