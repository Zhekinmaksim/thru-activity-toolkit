    <text x="168" y="297" fill="#FFFFFF" font-family="Avenir Next, Segoe UI, sans-serif" font-size="22" font-weight="700">1</text>
    <rect x="60" y="340" width="244" height="360" rx="28" fill="#FFFFFF" stroke="#D5DEEA"/>
    <text x="92" y="395" fill="#152B46" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28" font-weight="700">Setup</text>
    <text x="92" y="440" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">CLI config</text>
    <text x="92" y="472" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Key alias</text>
    <text x="92" y="504" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Account create</text>
    <text x="92" y="536" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">SDK install</text>
    <text x="92" y="568" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Faucet request</text>
    <rect x="92" y="612" width="114" height="36" rx="18" fill="#EAF2FB"/>
    <text x="114" y="636" fill="#275C89" font-family="Avenir Next, Segoe UI, sans-serif" font-size="16" font-weight="600">foundation</text>
