<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F2EDE4"/>

  <!-- left ink bar -->
  <rect x="0" y="0" width="80" height="900" fill="#1A1209"/>

  <!-- horizontal rules -->
  <line x1="0" y1="120" x2="1600" y2="120" stroke="#C8BFB0" stroke-width="1"/>
  <line x1="0" y1="270" x2="1600" y2="270" stroke="#1A1209" stroke-width="2"/>
  <line x1="0" y1="820" x2="1600" y2="820" stroke="#1A1209" stroke-width="3"/>

  <!-- Header -->
  <text x="108" y="82" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="6">THRU ALPHANET — TOOLKIT FLOW</text>

  <text x="108" y="224" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" font-style="italic">What the toolkit runs</text>

  <!-- Accent rule -->
  <rect x="108" y="240" width="400" height="4" fill="#D4491A"/>

  <!-- Subline -->
  <text x="108" y="258" fill="#4A3F33" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">Repeatable. Checks, retries, logs, and state snapshots.</text>

  <!-- Step columns - brutalist approach, no rounded cards just ruled boxes -->
  <!-- Step 1 -->
  <rect x="108" y="286" width="258" height="480" fill="#1A1209"/>
  <rect x="110" y="288" width="254" height="476" fill="#F2EDE4" stroke="#1A1209" stroke-width="2"/>
  <text x="124" y="336" fill="#D4491A" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700">01</text>
  <line x1="124" y1="348" x2="352" y2="348" stroke="#1A1209" stroke-width="2"/>
  <text x="124" y="382" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Setup</text>
  <text x="124" y="424" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">CLI config</text>
  <text x="124" y="452" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Key alias</text>
  <text x="124" y="480" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Account create</text>
  <text x="124" y="508" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">SDK install</text>
  <text x="124" y="536" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Faucet request</text>
  <rect x="124" y="700" width="106" height="30" fill="#1A1209"/>
  <text x="134" y="721" fill="#F2EDE4" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="1">foundation</text>

  <!-- Step 2 -->
  <rect x="378" y="286" width="258" height="480" fill="#1A1209"/>
  <rect x="380" y="288" width="254" height="476" fill="#F2EDE4" stroke="#1A1209" stroke-width="2"/>
  <text x="394" y="336" fill="#D4491A" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700">02</text>
  <line x1="394" y1="348" x2="622" y2="348" stroke="#1A1209" stroke-width="2"/>
  <text x="394" y="382" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Build</text>
  <text x="394" y="424" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Compile C code</text>
  <text x="394" y="452" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Produce binary</text>
  <text x="394" y="480" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Save local logs</text>
  <rect x="394" y="700" width="60" height="30" fill="#1A1209"/>
  <text x="404" y="721" fill="#F2EDE4" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="1">local</text>

  <!-- Step 3 -->
  <rect x="648" y="286" width="258" height="480" fill="#1A1209"/>
  <rect x="650" y="288" width="254" height="476" fill="#F2EDE4" stroke="#1A1209" stroke-width="2"/>
  <text x="664" y="336" fill="#D4491A" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700">03</text>
  <line x1="664" y1="348" x2="892" y2="348" stroke="#1A1209" stroke-width="2"/>
  <text x="664" y="382" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Deploy</text>
  <text x="664" y="424" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">RPC health check</text>
  <text x="664" y="452" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Faucet request</text>
  <text x="664" y="480" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Program upload</text>
  <text x="664" y="508" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">State snapshot</text>
  <rect x="664" y="700" width="98" height="30" fill="#1A1209"/>
  <text x="674" y="721" fill="#F2EDE4" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="1">networked</text>

  <!-- Step 4 -->
  <rect x="918" y="286" width="258" height="480" fill="#1A1209"/>
  <rect x="920" y="288" width="254" height="476" fill="#F2EDE4" stroke="#1A1209" stroke-width="2"/>
  <text x="934" y="336" fill="#D4491A" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700">04</text>
  <line x1="934" y1="348" x2="1162" y2="348" stroke="#1A1209" stroke-width="2"/>
  <text x="934" y="382" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Actions</text>
  <text x="934" y="424" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Counter create</text>
  <text x="934" y="452" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Counter increment</text>
  <text x="934" y="480" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Token mint init</text>
  <text x="934" y="508" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Nameservice init</text>
  <rect x="934" y="700" width="80" height="30" fill="#1A1209"/>
  <text x="944" y="721" fill="#F2EDE4" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="1">on-chain</text>

  <!-- Step 5 -->
  <rect x="1188" y="286" width="258" height="480" fill="#1A1209"/>
  <rect x="1190" y="288" width="254" height="476" fill="#F2EDE4" stroke="#1A1209" stroke-width="2"/>
  <text x="1204" y="336" fill="#D4491A" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700">05</text>
  <line x1="1204" y1="348" x2="1432" y2="348" stroke="#1A1209" stroke-width="2"/>
  <text x="1204" y="382" fill="#1A1209" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Verify</text>
  <text x="1204" y="424" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Resume safely</text>
  <text x="1204" y="452" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Retry on errors</text>
  <text x="1204" y="480" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Keep run history</text>
  <text x="1204" y="508" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="18">Check final state</text>
  <rect x="1204" y="700" width="66" height="30" fill="#1A1209"/>
  <text x="1214" y="721" fill="#F2EDE4" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="1">repeat</text>

  <!-- Bottom quote bar -->
  <rect x="80" y="820" width="1520" height="80" fill="#D4491A"/>
  <text x="108" y="870" fill="#F2EDE4" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic">One clean run matters less than having a path you can trust tomorrow.</text>
</svg>
