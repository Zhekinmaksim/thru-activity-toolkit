    <text x="443" y="297" fill="#FFFFFF" font-family="Avenir Next, Segoe UI, sans-serif" font-size="22" font-weight="700">2</text>
    <rect x="335" y="340" width="244" height="360" rx="28" fill="#FFFFFF" stroke="#D5DEEA"/>
    <text x="367" y="395" fill="#152B46" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28" font-weight="700">Build</text>
    <text x="367" y="440" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Compile C code</text>
    <text x="367" y="472" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Produce binary</text>
    <text x="367" y="504" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Save local logs</text>
    <rect x="367" y="612" width="94" height="36" rx="18" fill="#E7F3F1"/>
    <text x="392" y="636" fill="#1D7568" font-family="Avenir Next, Segoe UI, sans-serif" font-size="16" font-weight="600">local</text>
