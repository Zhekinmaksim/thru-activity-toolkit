    <text x="993" y="297" fill="#FFFFFF" font-family="Avenir Next, Segoe UI, sans-serif" font-size="22" font-weight="700">4</text>
    <rect x="885" y="340" width="244" height="360" rx="28" fill="#FFFFFF" stroke="#D5DEEA"/>
    <text x="917" y="395" fill="#152B46" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28" font-weight="700">Actions</text>
    <text x="917" y="440" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Counter create</text>
    <text x="917" y="472" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Counter increment</text>
    <text x="917" y="504" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Token mint init</text>
    <text x="917" y="536" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Nameservice init</text>
    <rect x="917" y="612" width="114" height="36" rx="18" fill="#E7F4EE"/>
    <text x="942" y="636" fill="#216C5F" font-family="Avenir Next, Segoe UI, sans-serif" font-size="16" font-weight="600">on-chain</text>
  </g>

  <g>
    <circle cx="1280" cy="286" r="34" fill="#1A7D66"/>
    <text x="1268" y="297" fill="#FFFFFF" font-family="Avenir Next, Segoe UI, sans-serif" font-size="22" font-weight="700">5</text>
    <rect x="1160" y="340" width="244" height="360" rx="28" fill="#FFFFFF" stroke="#D5DEEA"/>
    <text x="1192" y="395" fill="#152B46" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28" font-weight="700">Verify</text>
    <text x="1192" y="440" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Resume safely</text>
    <text x="1192" y="472" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Retry on errors</text>
    <text x="1192" y="504" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Keep run history</text>
    <text x="1192" y="536" fill="#5A6D86" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">Check final state</text>
